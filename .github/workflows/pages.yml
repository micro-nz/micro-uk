name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 15 * * *"   # 04:17 NZDT: refresh prices, stock and content from the NZ store daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Snapshot the Micro NZ catalogue (Storefront API)
        run: python3 tools/fetch_nz.py
      - name: Build the site
        run: python3 build.py --base /micro-uk
      - name: Audit (report only; the browser self-test runs locally)
        run: python3 tools/audit.py --no-deploy-check --out dist/remake-report.md || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
